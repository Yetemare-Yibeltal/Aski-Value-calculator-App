<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII & Unicode Value Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/metrics.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/frequency.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/binaryView.css">
  <link rel="stylesheet" href="css/bitwise.css">
  <link rel="stylesheet" href="css/hashView.css">
  <link rel="stylesheet" href="css/performance.css">
  <link rel="stylesheet" href="css/samples.css">
  <link rel="stylesheet" href="css/matrix.css">
</head>
<body>
  <div id="theme-container"></div>
  <div id="app">
    <header class="app-header">
      <h1>ASCII & Text Value Analyzer</h1>
      <p>Analyze character encodings, binary formats, and string metric analytics in real time.</p>
    </header>

    <main class="app-main">
      <!-- Preset Samples Section -->
      <section id="sample-container" class="sample-selector-box"></section>

      <!-- Main User Input Area -->
      <section class="input-section">
        <label for="text-input">Input Text <small>(Ctrl + K to focus)</small></label>
        <textarea id="text-input" placeholder="Type or paste text here to calculate values..."></textarea>
      </section>

      <!-- Execution Performance Tracker -->
      <section id="performance-container" class="perf-banner"></section>

      <!-- Query History Section -->
      <section id="history-container" class="history-panel"></section>

      <!-- Aggregate Metrics Grid Section -->
      <section id="metrics-container" class="metrics-grid"></section>

      <!-- Data Export Controls -->
      <section id="export-container" class="export-toolbar"></section>

      <!-- Bit Matrix Visualizer Section -->
      <section id="matrix-container" class="matrix-box"></section>

      <!-- Character Frequency Breakdown -->
      <section id="frequency-container" class="freq-container"></section>

      <!-- 32-Bit Hashing Output -->
      <section id="hash-container" class="hash-box"></section>

      <!-- Raw Binary Display Output -->
      <section id="binary-container" class="binary-converter-box"></section>

      <!-- Bitwise Operations Display -->
      <section id="bitwise-container" class="bitwise-box"></section>

      <!-- Detailed Encodings Data Table -->
      <section id="table-container" class="table-wrapper"></section>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
