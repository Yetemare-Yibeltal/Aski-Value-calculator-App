<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII & Unicode Value Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>ASCII & Text Value Analyzer</h1>
      <p>Analyze character encodings, binary formats, and string metric analytics in real time.</p>
    </header>
    <main class="app-main">
      <section class="input-section">
        <label for="text-input">Input Text</label>
        <textarea id="text-input" placeholder="Type or paste text here to calculate values..."></textarea>
      </section>
      <section class="results-section" id="results-container"></section>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
