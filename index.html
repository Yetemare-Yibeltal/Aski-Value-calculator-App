<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII & Unicode Value Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/metrics.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/frequency.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/binaryView.css">
  <link rel="stylesheet" href="css/bitwise.css">
  <link rel="stylesheet" href="css/hashView.css">
  <link rel="stylesheet" href="css/performance.css">
  <link rel="stylesheet" href="css/samples.css">
  <link rel="stylesheet" href="css/matrix.css">
</head>
<body>
  <div id="theme-container"></div>
  <div id="app">
    <header class="app-header">
      <h1>ASCII & Text Value Analyzer</h1>
      <p>Analyze character encodings, binary formats, and string metric analytics in real time.</p>
    </header>
    <main class="app-main">
      <div id="sample-container"></div>
      <section class="input-section">
        <label for="text-input">Input Text <small>(Ctrl + K to focus)</small></label>
        <textarea id="text-input" placeholder="Type or paste text here to calculate values..."></textarea>
      </section>
      <div id="performance-container"></div>
      <div id="history-container"></div>
      <div id="metrics-container"></div>
      <div id="export-container"></div>
      <div id="matrix-container"></div>
      <div id="frequency-container"></div>
      <div id="hash-container"></div>
      <div id="binary-container"></div>
      <div id="bitwise-container"></div>
      <div id="table-container"></div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
